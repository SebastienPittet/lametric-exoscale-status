# Static configuration for lametric-exoscale-status.
# The StatusPal API v2 is public open data: no API key exists or is used.

[statuspal]
base_url = "https://statuspal.eu/api/v2"
status_page_subdomain = "exoscalestatus"
request_timeout_seconds = 10

[caching]
ttl_seconds = 30

[security]
rate_limit_per_minute = 120

[lametric-app]
name = "Exoscale"
logo = "17776"

[status-logo]
# Service up: arrow up, green
up = "120"
# Service down, minor incident: arrow down, yellow
down-minor = "1067"
# Service down, major incident: arrow down, red
down-major = "124"
# Service down, on fire
down-fire = "2715"
# Service under scheduled maintenance: a red clock (animated)
scheduled = "7419"
# No status recognized: question mark
no-status = "625"
# Maintenance tool
tool = "93"

[lametric-country]
CH = "469"
DE = "512"
AT = "2954"
BG = "20415"
HG = ""
