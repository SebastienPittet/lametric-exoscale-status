name: PR size label

# Etiquette automatiquement les PR avec size/XS, size/S, size/M,
# size/L, size/XL, size/XXL selon le nombre de lignes modifiees.
# "pull_request_target" est requis par l'action : elle ne checkout PAS
# le code de la PR (aucune surface d'execution) et ne lit que le diff.
on:
  pull_request_target:
    types: [ opened, synchronize, reopened ]

jobs:
  size-label:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - name: Label PR by size
      uses: pascalgn/size-label-action@v0.5.7
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
